[package]
name = "xtask"
version = "0.0.0"
edition = "2021"
# No `rust-version`, for the reason in `conformance/Cargo.toml`: unpublished, and its 1.91 was
# contradicted by its own dependency on `usage-lib`.
license.workspace = true
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
usage-lib = { path = "../lib" }
