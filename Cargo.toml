[workspace]
resolver = "2"
members = [
    "argv",
    "config",
    "config-build",
    "derive",
    "usage-rs",
    "validation",
    "clap_usage",
    "cli",
    "conformance",
    "lib",
    "xtask",
    "benches/gate",
    "benches/shadows/mise",
    "benches/shadows/mise-clap",
    "benches/shadows/mise-argh",
    "benches/shadows/mise-bpaf",
    "benches/shadows/hk",
    "benches/shadows/fnox",
    "benches/shadows/pitchfork",
    "benches/shadows/aube",
    "benches/shadows/tak",
    "benches/shadows/communique",
]

# `benches/shadows/*` are generated by `mise run gen-shadow` and checked in. They are
# members like anything else: mise's command enums are boxed, as the real mise boxes its
# own, so nothing in them needs a lint silenced.

[workspace.package]
homepage = "https://usage.jdx.dev"
documentation = "https://usage.jdx.dev"
repository = "https://github.com/jdx/usage"
authors = ["Jeff Dickey @jdx"]
license = "MIT"

[workspace.dependencies]
clap_usage = { path = "./clap_usage", version = "5.0.0" }
usage-cli = { path = "./cli" }
usage-argv = { path = "./argv", version = "5.1.0" }
usage-config = { path = "./config", version = "5.1.0" }
usage-derive = { path = "./derive", version = "5.1.0" }
usage-lib = { path = "./lib", version = "5.1.0", features = ["clap", "validation"] }
usage-rs = { path = "./usage-rs", version = "5.1.0" }
usage-validation = { path = "./validation", version = "5.1.0" }

[workspace.metadata.release]
allow-branch = ["main"]
