[workspace]
resolver = "2"
members = [
    "argv",
    "derive",
    "clap_usage",
    "cli",
    "conformance",
    "lib",
    "xtask",
    "benches/gate",
]

# Generated, and not held to the same standard as code somebody wrote: a shadow of
# mise's spec trips `large_enum_variant` on the commands with thirty flags, which the
# real mise answers by boxing its variants — something the derive cannot express yet.
# The gate depends on it by path, so it is still built, and its parsing is tested from
# `benches/gate/tests`.
exclude = ["benches/shadows"]

[workspace.package]
homepage = "https://usage.jdx.dev"
documentation = "https://usage.jdx.dev"
repository = "https://github.com/jdx/usage"
authors = ["Jeff Dickey @jdx"]
license = "MIT"

[workspace.dependencies]
clap_usage = { path = "./clap_usage", version = "5.0.0" }
usage-cli = { path = "./cli" }
usage-argv = { path = "./argv", version = "5.1.0" }
usage-derive = { path = "./derive", version = "5.1.0" }
usage-lib = { path = "./lib", version = "5.1.0", features = ["clap"] }

[workspace.metadata.release]
allow-branch = ["main"]
