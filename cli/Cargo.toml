[package]
name = "usage-cli"
edition = "2021"
rust-version = "1.95"
version = "6.4.0"
description = "CLI for working with usage-based CLIs"
license = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }
homepage = { workspace = true }
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/NOTICE.md",
    "/src/**/*.rs",
    "/assets/**/*",
]

[[bin]]
name = "usage"
path = "src/main.rs"

[lib]
name = "usage_cli"
path = "src/lib.rs"

[dependencies]
env_logger = "0.11"
indexmap = "2"
itertools = "0.15"
log = "0.4"
regex = "1"
rmcp = { version = "3", features = ["server", "transport-io", "macros", "schemars"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
serde_with = "3"
shell-words = "1"
tera = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "io-std"] }
# The CLI is the facade's first adopter: `usage` parses its own command line with
# the parser it ships. Facade defaults already include diagnostics (and therefore
# `spec`) for `--usage-spec` and clap-shaped parse errors.
#
# `completions` is on for `usage_argv::install`, which `usage g completion --install`
# shares with a compiled binary installing its own script — so where a completion goes
# is decided once rather than twice. Not for completions of this CLI's own command line:
# it declares no `#[usage(completion)]`, and its own scripts are the checked-in assets.
usage-rs = { workspace = true, features = ["completions"] }
# `validation` rather than `clap`: the CLI has no clap dependency to convert *from*, and it
# parses arbitrary specs — without `validation`, a spec carrying `validate=` gets an error
# saying the feature is off, and `usage lint` stops rejecting malformed expressions.
usage-lib = { workspace = true, features = ["docs", "unstable_choices_env", "validation"] }

[target.'cfg(unix)'.dependencies]
exec = "0.3"

[dev-dependencies]
assert_cmd = { version = "2", features = ["color-auto"] }
ctor = "1"
insta = "1"
predicates = "3"
usage-rs = { workspace = true, features = ["test"] }

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/usage-{target}{ archive-suffix }"
[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/usage-universal-apple-darwin{ archive-suffix }"
[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/usage-universal-apple-darwin{ archive-suffix }"

[package.metadata.release]
shared-version = true
release = true
