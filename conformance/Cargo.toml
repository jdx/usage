[package]
name = "usage-conformance"
description = "Harness for the argv conformance corpus"
publish = false
version = "0.0.0"
edition = "2021"
rust-version = "1.80.0"
homepage = { workspace = true }
documentation = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
license = { workspace = true }

[dependencies]
kdl = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
usage-argv = { workspace = true, features = ["spec", "complete", "diagnostics"] }
usage-config = { workspace = true }
usage-lib = { workspace = true }

[dev-dependencies]
insta = "1"
usage-derive = { workspace = true }

[[bin]]
name = "oracle"
path = "src/bin/oracle.rs"
