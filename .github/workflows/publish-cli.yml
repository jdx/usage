name: publish-cli

permissions: {}

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: publish-cli-${{ github.ref_name }}

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  DRY_RUN: ${{ !startsWith(github.ref, 'refs/tags/v') }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NPM_CONFIG_FUND: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false
      - name: Create draft release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          awk '/^## \[/{if(found) exit; found=1} found{print}' CHANGELOG.md >/tmp/release-notes.txt
          BODY=$(cat /tmp/release-notes.txt)
          # GitHub may not have indexed the tag yet after a push. Draft releases
          # created before indexing get "untagged-*" placeholder tag names.
          for attempt in $(seq 1 30); do
            RESPONSE=$(gh api repos/${{ github.repository }}/releases \
              --method POST \
              -f tag_name="$TAG_NAME" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="$TAG_NAME" \
              -f body="$BODY" \
              -F draft=true)
            ACTUAL_TAG=$(echo "$RESPONSE" | jq -r '.tag_name')
            if [ "$ACTUAL_TAG" = "$TAG_NAME" ]; then
              echo "$RESPONSE" | jq -r '.html_url'
              exit 0
            fi
            RELEASE_ID=$(echo "$RESPONSE" | jq -r '.id')
            gh api "repos/${{ github.repository }}/releases/$RELEASE_ID" --method DELETE --silent
            echo "Tag not yet indexed (got $ACTUAL_TAG), retrying in 5s... (attempt $attempt/30)"
            sleep 5
          done
          echo "::error::Failed to create release with correct tag after 30 attempts"
          exit 1
  build-and-publish:
    needs: [create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: universal-apple-darwin
            os: macos-latest
            build-tool: cargo
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            build-tool: cross
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            build-tool: cross
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            build-tool: cross
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            build-tool: cross
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            build-tool: cargo
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            build-tool: cargo
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install Rust target
        if: ${{ matrix.target != 'universal-apple-darwin' }}
        run: rustup target add ${{ matrix.target }}
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          cache: false
      - if: matrix.os == 'macos-latest'
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTS_P12 }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTS_P12_PASS }}
      - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1
        with:
          bin: usage
          token: ${{ secrets.GITHUB_TOKEN }}
          target: ${{ matrix.target }}
          build-tool: ${{ matrix.build-tool }}
          manifest-path: cli/Cargo.toml
          include: cli/assets/usage.1
          codesign: "Developer ID Application: Jeffrey Dickey (4993Y37DX6)"
          codesign_prefix: dev.jdx.
          # Apple will not notarize a binary without the hardened runtime.
          codesign_options: runtime
          dry-run: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
          CARGO_PROFILE_RELEASE_LTO: true
      # Signing settles who built the binary; notarization is what Gatekeeper
      # demands once an archive carries the quarantine bit, which is to say
      # whenever someone downloads it in a browser rather than with curl.
      # Without a ticket it is blocked behind a "cannot be verified" dialog that
      # only a deliberate override gets past.
      #
      # The ticket lives on Apple's side and is keyed to the binary's cdhash, so
      # nothing here rewrites what was already built or uploaded -- stapling
      # would, but `stapler` only writes into bundles, disk images, and
      # installer packages, and this is a bare Mach-O in an archive. Gatekeeper
      # resolves the ticket online instead.
      - name: Notarize macOS binary
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          BINARIES: target/${{ matrix.target }}/release/usage
        run: |
          set -euo pipefail

          if [ -z "$APPLE_API_KEY_P8" ] || [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER_ID" ]; then
            echo "::warning title=Not notarized::App Store Connect credentials are unset, so this release ships signed but un-notarized macOS binaries. Gatekeeper will block them for anyone who downloads an archive through a browser."
            exit 0
          fi

          # Outside the workspace, so no later step can sweep the key into an
          # artifact, and removed even when notarization fails.
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$work/key.p8"

          # notarytool takes a container, never a bare executable. Copies are
          # fine: a Mach-O carries its signature inline, so the cdhash the
          # ticket is keyed to is the one already shipped.
          mkdir "$work/stage"
          for binary in $BINARIES; do
            cp "$binary" "$work/stage/"
          done
          # Apple rejects a binary without the hardened runtime or a secure
          # timestamp. Naming a missing one here turns an opaque Invalid verdict
          # into a diagnosis; Apple stays the authority on whether to accept.
          for binary in $BINARIES; do
            details="$(codesign --display --verbose=4 "$binary" 2>&1 || true)"
            case "$details" in
              *runtime*) ;;
              *) echo "::warning title=No hardened runtime::$binary is signed without --options runtime, which Apple requires; expect an Invalid verdict below." ;;
            esac
            case "$details" in
              *Timestamp=*) ;;
              *) echo "::warning title=No secure timestamp::$binary carries no secure timestamp, which Apple requires; expect an Invalid verdict below." ;;
            esac
          done

          ditto -c -k --norsrc --noextattr "$work/stage" "$work/submission.zip"

          # `--wait` is not a gate on its own: it can return zero on an Invalid
          # submission, so the reported status is what decides. plutil reads
          # JSON and ships with macOS, which keeps this off jq.
          result="$(xcrun notarytool submit "$work/submission.zip" \
            --key "$work/key.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --output-format json \
            --timeout 30m \
            --wait)"
          echo "$result"

          status="$(printf '%s' "$result" | plutil -extract status raw -o - -)"
          id="$(printf '%s' "$result" | plutil -extract id raw -o - -)"
          if [ "$status" != "Accepted" ]; then
            echo "::error::notarization returned $status for submission $id"
            xcrun notarytool log "$id" \
              --key "$work/key.p8" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER_ID" || true
            exit 1
          fi
          echo "notarized: submission $id"
  # The packslip is this release's signed inventory: every archive's digest,
  # the executable and man page inside it, the shared objects it needs from
  # the host, and the workflow identity that signed for all of it. An
  # installer checks a download against jdx/usage's identity rather than
  # against a key this project would have to hold. See https://packslip.dev.
  #
  # Its own job because build-and-publish uploads straight to the release from
  # each runner; one document covering the whole release can only be written
  # once every target has landed.
  packslip:
    name: Publish the packslip
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-and-publish]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download the release assets
        run: |
          mkdir -p dist
          gh release download "$GITHUB_REF_NAME" --repo "$REPO" --dir dist --clobber \
            --pattern 'usage-*.tar.gz' --pattern 'usage-*.zip'
          ls -la dist
        env:
          REPO: ${{ github.repository }}
      # usage is the tool that reads these specs, so it prints its own. A
      # consumer generates completions and documentation from the file with
      # its own copy of usage, and nothing of this release's has to run.
      - name: Publish the CLI specification
        run: |
          mkdir -p bin
          tar -xzf dist/usage-x86_64-unknown-linux-gnu.tar.gz -C bin
          bin/usage --usage-spec > usage.usage.kdl
          gh release upload "$GITHUB_REF_NAME" usage.usage.kdl --repo "$REPO" --clobber
        env:
          REPO: ${{ github.repository }}
      - uses: jdx/packslip@a6eddff2d884891faa2efbec374b48e7053df2c4 # v1.0.1
        with:
          artifacts: dist/usage-*.tar.gz dist/usage-*.zip
          bin: usage
          resources: |
            man=archive:usage.1
            cli-spec/usage=asset:usage.usage.kdl

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-and-publish, enhance-release, packslip]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false
      - run: gh release edit "${GITHUB_REF_NAME}" --draft=false
        if: ${{ github.event_name != 'workflow_dispatch' }}
  enhance-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [create-release]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false
      - run: communique generate "${GITHUB_REF_NAME}" --github-release
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Append jdx.dev sponsor blurb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # Strip any pre-existing sponsor section (e.g. one inserted by
          # communique) and trailing blanks before appending the canonical
          # block. Idempotent regardless of what's already in the body —
          # avoids the duplicate-block bug seen in mise v2026.5.4.
          {
            gh release view "$TAG" --json body --jq .body | awk '
              /^## .*Sponsor usage[[:space:]]*$/ { exit }
              /^[[:space:]]*$/ { blanks++; next }
              { while (blanks-- > 0) print ""; blanks = 0; print }
            '
            cat <<'EOF'

          ## 💚 Sponsor usage

          usage is built and maintained by [@jdx](https://github.com/jdx), an open source developer at [**entire.io**](https://entire.io/), the title sponsor of his open source work.

          If `usage` powers CLI specs, docs, or completions for a tool you maintain or use, please consider becoming an [individual or company sponsor](https://jdx.dev/sponsors.html). Your support funds ongoing development and helps keep usage fast, free, and independent.
          EOF
          } > /tmp/release-notes.md
          gh release edit "$TAG" --notes-file /tmp/release-notes.md
