name: test

on:
  push:
    branches: ["main"]
  pull_request:

# Held by the caller, which only calls test-impl.yml: a group set inside the
# called workflow would use this workflow's name too and wait for this run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  trusted:
    if: ${{ github.actor == 'jdx' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'jdx')) }}
    permissions:
      contents: read
    uses: $/.github/workflows/test-impl.yml
    with:
      trusted: true

  untrusted:
    if: ${{ github.actor != 'jdx' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login != 'jdx')) }}
    permissions:
      contents: read
    uses: $/.github/workflows/test-impl.yml
    with:
      trusted: false

  # Pushes the timings that the test job recorded on main. It is its own job so
  # the test jobs, which run pull request code, never hold a write token.
  jouet-cost:
    name: jouet-cost
    needs: [trusted]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # the token reaches only the push step
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: jouet
          github_token: "" # the job token can write, so the install gets none
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: jouet-cost-*
          merge-multiple: true
          path: jouet-cost-bundles
      - name: Merge and push the timings
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader "GIT_CONFIG_VALUE_0=AUTHORIZATION: basic $auth"
          n=0
          for b in jouet-cost-bundles/*.bundle; do
            [ -e "$b" ] || continue
            jouet cost fetch "./$b"
            n=$((n + 1))
          done
          if [ "$n" -eq 0 ]; then
            echo "No timing bundles were uploaded; nothing to push."
            exit 0
          fi
          jouet cost push

  final:
    name: final
    if: ${{ always() && !cancelled() && needs.trusted.result != 'cancelled' && needs.untrusted.result != 'cancelled' }}
    permissions: {}
    needs: [trusted, untrusted]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check selected workflow result
        env:
          TRUSTED_RESULT: ${{ needs.trusted.result }}
          UNTRUSTED_RESULT: ${{ needs.untrusted.result }}
        run: |
          if [[ "$TRUSTED_RESULT" == success && "$UNTRUSTED_RESULT" == skipped ]] ||
             [[ "$TRUSTED_RESULT" == skipped && "$UNTRUSTED_RESULT" == success ]]; then
            exit 0
          fi
          echo "trusted=$TRUSTED_RESULT untrusted=$UNTRUSTED_RESULT"
          exit 1
