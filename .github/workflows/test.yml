name: test
on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  MISE_EXPERIMENTAL: 1
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - name: Install shells for completion integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh fish
          # pwsh is pre-installed on GitHub ubuntu-latest images. Self-heal
          # if a future image drops it so the integration test still runs
          # (rather than panicking under CI=1).
          if ! command -v pwsh >/dev/null 2>&1; then
            sudo snap install powershell --classic
          fi
      - run: mise r build
      - run: mise r test
      - run: mise r render
      - name: assert render produces no diff
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::'mise run render' produced changes. Run it locally and commit."
            git status
            git diff
            exit 1
          fi
      - run: mise r lint
