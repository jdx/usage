[package]
name = "usage-rs"
description = "A compiled CLI parser for Rust, built on usage specs"
version = "7.0.0"
edition = "2024"
rust-version = "1.91"
homepage = { workspace = true }
documentation = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
license = { workspace = true }

[dependencies]
usage-argv = { workspace = true }
usage-derive = { workspace = true, optional = true }
usage-test = { workspace = true, optional = true }
usage-validation = { workspace = true, optional = true }
usage-config = { workspace = true, optional = true }
shell-words = { version = "1", optional = true }

[features]
# Applications get a usable CLI out of the box: parse tables, help, and
# clap-shaped errors. Completions and expression validation stay opt-in.
# Low-level adopters that want only the binding runtime keep depending on
# `usage-argv` directly (no defaults), and add this crate with `default-features = false,
# features = ["spec"]` if they use the derives, which write their paths through it. The
# `Config` derive writes `usage_rs::config` and `validate` expressions write
# `usage_rs::validation`, so those adopters also enable `config` or `validation`.
default = ["spec", "help", "diagnostics", "help-advanced"]
spec = ["usage-argv/spec", "dep:usage-derive"]
help = ["spec"]
help-advanced = ["help", "usage-argv/help-advanced"]
completions = ["spec", "usage-argv/complete", "usage-test?/completions"]
# Kept as a spelling close to the runtime feature for low-level adopters.
complete = ["completions"]
diagnostics = ["spec", "usage-argv/diagnostics"]
validation = ["dep:usage-validation"]
# Assertions about command output, what a command line parses to, what a page says, and what a
# shell is offered. A dev-dependency feature: nothing in an application's own code calls it.
test = ["spec", "help", "dep:usage-test"]
# Settings: the `usage_rs::Config` derive, and the resolver as `usage_rs::config`.
config = ["spec", "dep:usage-config"]
# Explicit, cold-path expansion of @response files before parsing.
response-files = ["dep:shell-words"]

[package.metadata.release]
shared-version = true
release = true

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
tempfile = "3"
