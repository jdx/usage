[package]
name = "usage-rs"
description = "A compiled CLI parser for Rust, built on usage specs"
version = "5.1.0"
edition = "2021"
rust-version = "1.91"
homepage = { workspace = true }
documentation = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
license = { workspace = true }

[dependencies]
usage-argv = { workspace = true }
usage-derive = { workspace = true, optional = true }
usage-validation = { workspace = true, optional = true }

[features]
# Applications get a usable CLI out of the box: parse tables, help, clap-shaped
# errors, and portable validation. Completions stay opt-in. Low-level adopters
# that want only the binding runtime keep depending on `usage-argv` directly
# (no defaults).
default = ["spec", "help", "diagnostics", "validation"]
spec = ["usage-argv/spec", "dep:usage-derive"]
help = ["spec"]
completions = ["spec", "usage-argv/complete"]
# Kept as a spelling close to the runtime feature for low-level adopters.
complete = ["completions"]
diagnostics = ["spec", "usage-argv/diagnostics"]
validation = ["dep:usage-validation"]

[package.metadata.release]
shared-version = true
release = true
