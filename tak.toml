# Instruction-counted benchmarks, measured by tak (https://github.com/jdx/tak).
#
# usage is the one tool here whose real work is a pure function: read a KDL
# spec, generate output. That makes it the most representative subject of the
# family — no network, no state, and the thing being measured is what the tool
# is for. Hermeticity was checked with the proxy pointed at a dead port.
#
# `--version` is deliberately absent. It measures clap rather than usage.

# The fixed cost of any invocation. Reading the generators against this
# separates "usage got slower to start" from "generation got slower".
[bench.startup]
cmd = ["./target/release/usage", "--help"]

# Generate the docs for usage's own committed spec: parse ~10KB of KDL, walk the
# command tree, render markdown. This is the hot path for every project that
# runs `usage g` in its docs build.
[bench.markdown]
cmd = [
  "./target/release/usage",
  "g",
  "markdown",
  "-mf",
  "cli/usage.usage.kdl",
  "--out-dir",
  "/tmp/tak-usage-docs",
]
runs = 10

# The gate: the same mise command line parsed by each framework, plus a binary that
# does everything except parse. The parse itself is the difference between the third
# number and the first — roughly two thirds of a small binary's instructions are the
# dynamic loader and libc starting up, and neither parser is responsible for those.
#
# `use -g node@20` rather than something exotic: it selects a subcommand, takes a
# global short, a switch and a value, which is what a real invocation looks like. The
# cost turns out to be near constant across shapes anyway, since there is no tree to
# build.
[bench.gate-baseline]
cmd = ["./target/release/parse-none", "use", "-g", "node@20"]
runs = 10

[bench.gate-usage]
cmd = ["./target/release/parse-usage", "use", "-g", "node@20"]
runs = 10

[bench.gate-clap]
cmd = ["./target/release/parse-clap", "use", "-g", "node@20"]
runs = 10
